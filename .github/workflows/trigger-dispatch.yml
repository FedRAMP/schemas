name: Trigger Dispatch

on:
  workflow_dispatch: 
  push:
    branches:
      - main
    paths:
      - 'fedramp-certification-package-overview-schema-*.json'
      - 'fedramp-advisor-information-schema-*.json'
      - 'fedramp-assessor-information-schema-*.json'

jobs:
  trigger-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCHEMA_DISPATCH }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: '${{ secrets.TARGET_OWNER }}',
              repo: '${{ secrets.TARGET_REPO }}',
              event_type: 'trigger-schema-update',
              client_payload: {
                message: 'Schema files changed',
                triggered_by: context.repo.repo,
                sha: context.sha,
                ref: context.ref
              }
            });
